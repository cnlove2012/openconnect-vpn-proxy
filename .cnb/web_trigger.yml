branch:
  # 只在 main 分支的详情页出现按钮
  # （reg 为正则；.cnb.yml 顶层分支键才是 glob，两者语义不同）
  - reg: main
    buttons:
      - name: 发布新版本
        description: 计算下一个 CalVer 版本（v年.周.build），打 Tag 并构建推送镜像
        event: web_trigger_release
        isDefault: true
        groupName: 发布
        permissions:
          # 只有负责人 / 管理员可发布（还需仓库写权限）
          roles:
            - owner
            - master
        inputs:
          # input 名与 git-tag.sh 读取的环境变量严格一致（SKIP_IMAGE / NO_LATEST）；
          # 默认全关 = 默认构建镜像 + 更新 latest
          - name: 发布选项
            collapsed: true
            inputs:
              SKIP_IMAGE:
                name: 跳过镜像构建（仅打 Tag）
                type: switch
                default: "false"
                options:
                  - name: 是
                    value: "true"
                  - name: 否
                    value: "false"
              NO_LATEST:
                name: 不更新 latest 镜像标签
                type: switch
                default: "false"
                options:
                  - name: 是
                    value: "true"
                  - name: 否
                    value: "false"
