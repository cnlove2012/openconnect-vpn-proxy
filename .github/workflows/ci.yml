name: Container image release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      no_latest:
        description: Do not update the latest image tag
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  create-release-tag:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.create.outputs.tag }}
      created: ${{ steps.create.outputs.created }}
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create annotated CalVer tag
        id: create
        shell: bash
        env:
          NO_LATEST: ${{ inputs.no_latest }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail

          week="$(date -u +%G.%V)"
          max_build=0
          while IFS= read -r existing; do
            [[ "$existing" =~ ^v([0-9]{4}\.[0-9]{1,2})\.([0-9]+)$ ]] || continue
            [[ "${BASH_REMATCH[1]}" == "$week" ]] || continue
            candidate="${BASH_REMATCH[2]}"
            candidate_number=$((10#$candidate))
            if (( candidate_number > max_build )); then
              max_build="$candidate_number"
            fi
          done < <(git tag --list 'v*')
          tag="v${week}.$((max_build + 1))"
          image_name="$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; refusing to reuse a release version"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing_tags="$(git tag --points-at "$GITHUB_SHA")"
          if [[ -n "$existing_tags" ]]; then
            echo "Commit $GITHUB_SHA already has a release tag:"
            printf '%s\n' "$existing_tags"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag_message="$(printf 'Release %s\n\nImage: %s:%s\nCommit: %s\nWorkflow: https://github.com/%s/actions/runs/%s' \
            "$tag" "$image_name" "${tag#v}" "$GITHUB_SHA" \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          git tag -a "$tag" -m "$tag_message" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: create-release-tag
    if: >-
      always() &&
      (github.event_name == 'push' ||
       needs.create-release-tag.outputs.created == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref || needs.create-release-tag.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || needs.create-release-tag.outputs.tag }}
          NO_LATEST: ${{ inputs.no_latest }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail

          image_name="$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          image_tag="$RELEASE_TAG"
          if [[ "$RELEASE_TAG" == v[0-9]* ]]; then
            image_tag="${RELEASE_TAG#v}"
          fi
          if [[ ! "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid container image tag: $image_tag" >&2
            exit 1
          fi

          {
            echo "tags<<EOF"
            printf '%s:%s\n' "$image_name" "$image_tag"
            if [[ "$RELEASE_TAG" =~ ^v[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]] &&
               [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$NO_LATEST" != true ]]; then
              printf '%s:latest\n' "$image_name"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
